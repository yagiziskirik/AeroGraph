[alias]
# Fast lint & style shortcuts
lint = "clippy -- -D warnings"
fmt-check = "fmt --all --check"

# Native workspace tasks (runs src/bin/xtask.rs)
xtask = "run --bin xtask --"
check-all = "run --bin xtask -- check"
ui-build = "run --bin xtask -- ui-build"
local = "run --bin xtask -- local"
installer = "run --bin xtask -- installer"
