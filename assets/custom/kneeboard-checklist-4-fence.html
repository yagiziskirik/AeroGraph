<html><head><title>BMS Fence IN/OUT</title>
 <link rel="stylesheet" href="kneeboard.css" type="text/css" media="screen" />
 <link rel="icon" type="image/png" href="favicon.png" />
</head><body>
<div class="page">
<div class="section">
<table>
<tr><th class="title" colspan="2" style="background:#222222; color:#FFFFFF">Fence IN</th></tr>
<tr class="odd"><td class="half">Exterior Lights</td><td class="rightalign">OFF</td></tr>
<tr class="even"><td class="half">AVTR</td><td class="rightalign">As Required</td></tr>
<tr class="odd"><td class="half">ECM</td><td class="rightalign">Set</td></tr>
<tr class="even"><td class="half">CMDS Program</td><td class="rightalign">Set</td></tr>
<tr class="odd"><td class="half">MASTER ARM</td><td class="rightalign">ARM</td></tr>
<tr class="even"><td class="half">LASER / DED</td><td class="rightalign">ARM / Set</td></tr>
<tr class="odd"><td class="half">FCR</td><td class="rightalign">As Required</td></tr>
<tr class="even"><td class="half">SMS</td><td class="rightalign">Set</td></tr>
<tr class="odd"><td class="half">WPN Page</td><td class="rightalign">Set</td></tr>
<tr class="even"><td class="half">TGP</td><td class="rightalign">Set</td></tr>
</table>
</div>
<div class="section">
<table>
<tr><th class="title" colspan="2" style="background:#222222; color:#FFFFFF">Fence OUT</th></tr>
<tr class="odd"><td class="half">Exterior Lights</td><td class="rightalign">ON</td></tr>
<tr class="even"><td class="half">AVTR</td><td class="rightalign">OFF</td></tr>
<tr class="odd"><td class="half">ECM</td><td class="rightalign">As required</td></tr>
<tr class="even"><td class="half">CMDS</td><td class="rightalign">As required</td></tr>
<tr class="odd"><td class="half">MASTER ARM</td><td class="rightalign">OFF</td></tr>
<tr class="even"><td class="half">LASER</td><td class="rightalign">OFF</td></tr>
</table>
</div>
</div>
</body></html>
